<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>작업 로그 - 성능기골 스티커 보드</title>
    <link rel="stylesheet" href="tokens.css?v=20261115">
    <link rel="stylesheet" href="pages.css?v=20261115">
    <style>
        .container { max-width: 1200px; }
        table { min-width: 800px; }
        .log-details {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            word-break: break-all;
        }
        .filter-group {
            margin-bottom: var(--spacing-4);
            background: var(--color-background-surface);
            padding: var(--spacing-4);
            border-radius: var(--radius-container);
            box-shadow: var(--shadow-low);
            display: flex;
            align-items: center;
            gap: var(--spacing-3);
            flex-wrap: wrap;
        }
        .filter-group label {
            display: flex;
            align-items: center;
            gap: var(--spacing-2);
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
        }
        @media (max-width: 600px) {
            .filter-group label { width: 100%; }
            .filter-group label .field { flex: 1; min-width: 0; }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">← 보드</a>
        <h1 class="page-title">로그 조회</h1>
        <div></div>
    </header>

    <div class="container">
        <h2>작업 로그 조회</h2>
        
        <div class="filter-group">
            <label>사용자: <input type="text" id="filterUser" class="field" placeholder="사용자명"></label>
            <label>작업: 
                <select id="filterAction" class="field">
                    <option value="">전체</option>
                    <option value="LOGIN">로그인</option>
                    <option value="LOGOUT">로그아웃</option>
                    <option value="CREATE_NOTE">스티커 생성</option>
                    <option value="UPDATE_NOTE">스티커 수정</option>
                    <option value="DELETE_NOTE">스티커 삭제</option>
                    <option value="DELETE_ALL">전체 삭제</option>
                    <option value="VOTE">투표</option>
                    <option value="PIN_NOTE">고정</option>
                </select>
            </label>
            <button class="btn btn-primary" onclick="applyFilters()">필터 적용</button>
            <button class="btn" onclick="clearFilters()">초기화</button>
        </div>
        
        <div class="table-wrapper">
            <div id="logsContainer" class="loading">로그를 불러오는 중...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            get,
            query,
            orderByChild
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyBsOQMj6GTx1GVJVqjurZGlk0c1v1MjNOk",
            authDomain: "board-sheet-metal.firebaseapp.com",
            databaseURL: "https://board-sheet-metal-default-rtdb.firebaseio.com",
            projectId: "board-sheet-metal",
            storageBucket: "board-sheet-metal.firebasestorage.app",
            messagingSenderId: "300454183349",
            appId: "1:300454183349:web:7a5e681d9c6c1f7b5999fc"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        
        let allLogs = [];
        
        function getActionBadgeClass(action) {
            if (action.includes('CREATE')) return 'badge-success';
            if (action.includes('UPDATE')) return 'badge-info';
            if (action.includes('DELETE')) return 'badge-error';
            if (action === 'LOGIN') return '';
            if (action === 'LOGOUT') return '';
            return 'badge-warning';
        }
        
        function formatDate(timestamp) {
            const date = new Date(timestamp);
            return date.toLocaleString('ko-KR');
        }
        
        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');
            
            if (logs.length === 0) {
                container.innerHTML = '<div class="no-data">로그가 없습니다.</div>';
                return;
            }
            
            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>시간</th>
                            <th>사용자</th>
                            <th>작업</th>
                            <th>상세 정보</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            logs.forEach(log => {
                const details = log.details ? JSON.stringify(log.details) : '-';
                html += `
                    <tr>
                        <td><span class="timestamp">${formatDate(log.timestamp)}</span></td>
                        <td><strong>${log.user}</strong></td>
                        <td><span class="badge ${getActionBadgeClass(log.action)}">${log.action}</span></td>
                        <td class="log-details">${details}</td>
                    </tr>
                `;
            });
            
            html += `
                    </tbody>
                </table>
            `;
            
            container.innerHTML = html;
        }
        
        async function loadLogs() {
            try {
                const logsRef = ref(db, 'logs');
                const snapshot = await get(logsRef);
                
                if (!snapshot.exists()) {
                    renderLogs([]);
                    return;
                }
                
                const data = snapshot.val();
                allLogs = [];
                
                for (const key in data) {
                    allLogs.push({
                        id: key,
                        ...data[key]
                    });
                }
                
                // 시간순으로 정렬 (최신순)
                allLogs.sort((a, b) => b.timestamp - a.timestamp);
                
                renderLogs(allLogs);
            } catch (error) {
                console.error('로그 로드 오류:', error);
                document.getElementById('logsContainer').innerHTML = '<div class="no-data">로그를 불러올 수 없습니다.</div>';
            }
        }
        
        window.applyFilters = () => {
            const filterUser = document.getElementById('filterUser').value.toLowerCase();
            const filterAction = document.getElementById('filterAction').value;
            
            let filtered = allLogs;
            
            if (filterUser) {
                filtered = filtered.filter(log => log.user.toLowerCase().includes(filterUser));
            }
            
            if (filterAction) {
                filtered = filtered.filter(log => log.action === filterAction);
            }
            
            renderLogs(filtered);
        };
        
        window.clearFilters = () => {
            document.getElementById('filterUser').value = '';
            document.getElementById('filterAction').value = '';
            renderLogs(allLogs);
        };
        
        // 페이지 로드 시 로그 로드
        window.addEventListener('load', loadLogs);
    </script>
</body>
</html>
