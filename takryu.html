function drawBg(si,dt){
  const st=ST[si],g=ctx.createLinearGradient(0,0,0,H),bl=G.bloom,t=G.time;
  if(st.deco==='tunnel'){const h=(t*40)%360;g.addColorStop(0,'hsl('+h+',45%,17%)');g.addColorStop(1,'hsl('+((h+70)%360)+',50%,8%)');}
  else if(st.deco==='garden'&&bl>0){g.addColorStop(0,mix('#8f8c92','#f6c6d6',bl));g.addColorStop(1,mix('#57545b','#b8d8a8',bl));}
  else{g.addColorStop(0,st.bg[0]);g.addColorStop(1,st.bg[1]);}
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  const sp=st.deco==='tunnel'?200:st.deco==='space'?25:60,span=G.span||1100;
  if(st.deco==='tunnel'){
    ctx.lineWidth=2;for(let k=0;k<7;k++){const z=((t*.7+k/7)%1),w=W*1.7*z*z,h=H*1.5*z*z;ctx.strokeStyle='rgba(255,255,255,'+(z*.35)+')';rr(W/2-w/2,H/2-h/2,w,h,20*z);ctx.stroke();}
  }
  if(st.deco==='crater'||st.deco==='city'){
    if(st.deco==='city'){ctx.fillStyle='rgba(0,0,0,.14)';ctx.fillRect(80,0,W-160,H);ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(79,0,2,H);ctx.fillRect(W-81,0,2,H);}
    else{ctx.fillStyle='rgba(0,0,0,.12)';ctx.fillRect(W/2-46,0,92,H);}
    ctx.fillStyle='rgba(255,255,255,.1)';const o=(t*60)%60;for(let y=-60+o;y<H;y+=60)ctx.fillRect(W/2-2,y,4,28);}
  for(const d of D){
    d.y+=d.v*sp*dt;
    if(d.vx||d.vy){d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.x<-16)d.x=W+14;else if(d.x>W+16)d.x=-14;if(d.y<-190)d.y+=span;}
    if(d.y>span-180){d.y-=span;if(d.rx)d.x=R(d.rx[0],d.rx[1]);}
  }
  D.sort((a,b)=>a.z-b.z||a.y-b.y);
  for(const d of D)if(d.y<H+110)drawDeco(d,t,bl);
  if(st.deco!=='garden'&&st.deco!=='tunnel'){ctx.fillStyle=hexA(st.bg[1],.16);ctx.fillRect(0,0,W,H);}
}

let moveId=null;
function pos(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W,y:(e.clientY-r.top)/r.height*H};}
function target(p){if(!P)return;P.tx=clamp(p.x,14,W-14);P.ty=clamp(p.y-50,60,H-24);}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audioInit();if(AC&&AC.state==='suspended')AC.resume();
  const p=pos(e);
  for(let i=BTN.length-1;i>=0;i--){const b=BTN[i];if(p.x>=b.x&&p.x<=b.x+b.w&&p.y>=b.y&&p.y<=b.y+b.h){b.cb();return;}}
  if(G.state==='play'&&!G.paused){moveId=e.pointerId;target(p);}
  else if(G.state==='opening'){if(G.t>.25){snd('ui');G.opI++;G.t=0;if(G.opI>=OP.length){G.state='select';}}}
  else if(G.state==='intro'){if(G.t>.4)G.t=9;}
  else if(G.state==='ending'){if(G.t>.4&&G.endI<ENDC.length+1){snd('ui');G.endI++;G.t=0;}}
},{passive:false});
cv.addEventListener('pointermove',e=>{if(e.pointerId===moveId&&G.state==='play'&&!G.paused){e.preventDefault();target(pos(e));}},{passive:false});
function up(e){if(e.pointerId===moveId)moveId=null;}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();useBomb();}
  else if(e.code==='Escape'||e.code==='KeyP'){if(G.state==='play')G.paused=!G.paused;}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&G.state==='play')G.paused=true;});

/* ---------- 메인 루프 ---------- */
let last=0;
function frame(now){
  let dt=Math.min(.034,(now-last)/1000||0);last=now;
  G.time+=dt;G.t+=dt;
  const running=G.state==='play'&&!G.paused;
  G.dt=(running||G.state==='ending'||G.state==='intro')?dt:0;
  let sdt=dt;if(G.slow>0&&running){G.slow-=dt;sdt=dt*.35;}
  let stop=false;if(running&&G.hs>0){G.hs-=dt;stop=true;}
  if(running&&!stop)update(sdt);
  if(running)G.dt=stop?0:sdt;
  if(G.state==='intro'&&G.t>2.8){G.state='play';G.t=0;}
  if(G.state==='play'||G.state==='over'){if(!G.paused&&!stop)updFx(sdt);}
  ctx.setTransform(SC*DPR,0,0,SC*DPR,0,0);ctx.textBaseline='alphabetic';
  BTN=[];
  switch(G.state){
    case'title':drawTitle();break;
    case'credits':drawCredits();break;
    case'opening':drawOpening();break;
    case'select':drawSelect();break;
    case'intro':drawIntro();break;
    case'play':drawPlay();if(G.paused){drawPause();}else drawHud();break;
    case'over':drawOver();break;
    case'up':drawUp();break;
    case'ending':drawEnding();break;
    case'rank':drawRank();break;
  }
  requestAnimationFrame(frame);
}

<script type="module">
// 성능보드판과 같은 Firebase Realtime Database / 로그인(localStorage username) 사용
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
const app = initializeApp({
  apiKey: "AIzaSyBsOQMj6GTx1GVJVqjurZGlk0c1v1MjNOk",
  authDomain: "board-sheet-metal.firebaseapp.com",
  databaseURL: "https://board-sheet-metal-default-rtdb.firebaseio.com",
  projectId: "board-sheet-metal",
  storageBucket: "board-sheet-metal.firebasestorage.app",
  messagingSenderId: "300454183349",
  appId: "1:300454183349:web:7a5e681d9c6c1f7b5999fc"
});
const db = getDatabase(app);
const username = localStorage.getItem("username");
if (!username) location.href = "auth.html";
const key = String(username || "").replace(/[.#$/[\]]/g, "_");
const PATH = "takryu_scores";

async function all() {
  const snap = await get(ref(db, PATH));
  return Object.entries(snap.val() || {})
    .filter(([, e]) => e && typeof e.score === "number")
    .map(([k, e]) => ({ ...e, key: k }))
    .sort((a, b) => b.score - a.score || (a.updatedAt || 0) - (b.updatedAt || 0));
}
function rankOf(list) {
  const i = list.findIndex((e) => e.key === key);
  return i < 0 ? null : { rank: i + 1, score: list[i].score };
}
window.TKR = {
  user: username,
  // 사용자별 최고 점수만 저장
  async submit(rec) {
    const cur = (await get(ref(db, `${PATH}/${key}`))).val();
    const newBest = !cur || rec.score > (cur.score || 0);
    if (newBest) await set(ref(db, `${PATH}/${key}`), { name: username, ...rec, updatedAt: Date.now() });
    const list = await all();
    const r = rankOf(list) || { rank: list.length + 1 };
    return { newBest, rank: r.rank, total: list.length };
  },
  async top(n) {
    const list = await all();
    return { list: list.slice(0, n), mine: rankOf(list), total: list.length };
  }
};
</script>
