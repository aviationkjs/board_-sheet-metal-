<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1F1F22" media="(prefers-color-scheme: dark)">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="성능보드판">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
    <link rel="icon" href="assets/icon-192.png">
    <script src="pwa.js?v=20261124" defer></script>
    <title>성능기골 스티커 보드</title>
    <link rel="stylesheet" href="tokens.css?v=20261124">
    <link rel="stylesheet" href="style.css?v=20261124">
    <script type="module" src="app.js?v=20261124"></script>
    <script type="module" src="notice.js?v=20261124"></script>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>성능보드판</h1>
            <div id="username"></div>
        </div>
        <div class="header-buttons">
            <button id="addNoticeBtn" class="nav-btn accent" hidden>+ 공지</button>
            <button id="addEventBtn" class="nav-btn accent" hidden>+ 일정</button>
            <button id="addNoteBtn" class="nav-btn accent" hidden>+ 스티커</button>
            <div class="nav-item">
                <button id="moreMenuBtn" class="nav-btn icon-btn" title="더보기" aria-label="더보기">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
                </button>
                <div class="dropdown dropdown-right" id="moreMenu">
                    <div class="drop-label">사역</div>
                    <div class="drop-info">
                        <div class="drop-info-label">이번 순번</div>
                        <div class="drop-info-value" id="dutyCurrentName">-</div>
                    </div>
                    <button id="dutyViewBtn" class="drop-item">전체 사역표 보기</button>

                    <div class="drop-divider"></div>
                    <div class="drop-label">업무 도구</div>
                    <button id="removeListBtn" class="drop-item" onclick="location.href='remove_list.html'">자재소모</button>
                    <button id="infoBtn" class="drop-item">Fastener Drill Reference Table</button>
                    <button id="huckViewBtn" class="drop-item">FT-200 Guide</button>
                    <button id="dividerBtn" class="drop-item" onclick="location.href='divider.html'">균등분할 계산기</button>
                    <button id="manualQaBtn" class="drop-item" onclick="location.href='https://aviationkjs.github.io/anual-flow-qa/'">정비메뉴얼예시</button>

                    <div class="drop-divider"></div>
                    <div class="drop-label">학습·쉬어가기</div>
                    <button id="ganttBtn" class="drop-item" onclick="location.href='gantt.html'">학습 간트차트</button>
                    <button id="takryuBtn" class="drop-item" onclick="location.href='takryu.html'">탁류 슈팅게임</button>

                    <div class="drop-divider"></div>
                    <div class="drop-label">관리·계정</div>
                    <button id="installBtn" class="drop-item" hidden>홈 화면에 앱 설치</button>
                    <button id="usersBtn" class="drop-item" style="display: none;">회원 관리</button>
                    <button id="logsBtn" class="drop-item" style="display: none;">로그 조회</button>
                    <button id="deleteAllBtn" class="drop-item danger">전체삭제</button>
                    <button id="logoutBtn" class="drop-item">로그아웃</button>
                </div>
            </div>
        </div>
    </header>

    <nav class="tabs" id="tabs" role="tablist" aria-label="보드 화면">
        <button class="tab is-on" data-tab="notice" role="tab" aria-selected="true">
            공지<span class="tab-badge" id="noticeBadge" hidden>0</span>
        </button>
        <button class="tab" data-tab="calendar" role="tab" aria-selected="false">달력</button>
        <button class="tab" data-tab="board" role="tab" aria-selected="false">스티커</button>
    </nav>

    <main class="main">
        <!-- 공지 -->
        <section id="panelNotice" class="tab-panel">
            <div class="panel-bar" id="noticeBar" hidden>
                <button class="link-btn" id="archiveToggle">보관함 보기</button>
            </div>
            <div id="noticeList"></div>
        </section>

        <!-- 달력 -->
        <section id="panelCalendar" class="tab-panel" hidden>
            <div class="cal-head">
                <div class="cal-nav">
                    <button class="action-btn" id="calPrev" aria-label="이전 달">‹</button>
                    <strong id="calTitle">—</strong>
                    <button class="action-btn" id="calNext" aria-label="다음 달">›</button>
                    <button class="nav-btn" id="calToday">오늘</button>
                </div>
                <div class="cal-layers">
                    <label><input type="checkbox" id="layerNotice" checked> 공지 일정</label>
                    <label><input type="checkbox" id="layerEvent" checked> 일정</label>
                </div>
            </div>
            <div class="cal-grid" id="calGrid"></div>
            <div class="day-panel" id="dayPanel"></div>
        </section>

        <!-- 스티커 (기존 보드) -->
        <div id="board" class="tab-panel" hidden></div>
    </main>

    <!-- 공지 작성·수정 -->
    <dialog id="noticeDlg" class="dlg">
        <form class="dlg-form" id="noticeForm" method="dialog">
            <h2 id="noticeDlgTitle">공지 작성</h2>
            <label class="f"><span>제목</span>
                <input id="nTitle" maxlength="60" required placeholder="한 줄로 요약해 주세요">
            </label>
            <label class="f"><span>내용</span>
                <textarea id="nBody" rows="6" maxlength="2000" placeholder="공지 내용"></textarea>
            </label>
            <div class="f-row">
                <label class="chk"><input type="checkbox" id="nImportant"> 중요</label>
                <label class="chk"><input type="checkbox" id="nPinned"> 상단 고정</label>
            </div>
            <div class="f-row">
                <label class="f"><span>일정 시작 <i>선택</i></span><input type="date" id="nFrom"></label>
                <label class="f"><span>일정 종료 <i>선택</i></span><input type="date" id="nTo"></label>
            </div>
            <label class="f"><span>투표 선택지 <i>선택 · 한 줄에 하나, 2개 이상</i></span>
                <textarea id="nPoll" rows="3" placeholder="예)&#10;참석&#10;불참"></textarea>
            </label>
            <p class="dlg-hint">날짜를 넣으면 달력에도 함께 표시됩니다. 선택지를 넣으면 공지에 투표가 붙습니다.</p>
            <div class="dlg-actions">
                <button type="submit" value="cancel" class="nav-btn" formnovalidate>취소</button>
                <button type="submit" value="ok" class="nav-btn accent">저장</button>
            </div>
        </form>
    </dialog>

    <!-- 읽음·투표 현황 (관리자·공지 부관리자 전용) -->
    <dialog id="rosterDlg" class="dlg">
        <div class="dlg-form">
            <h2 id="rosterTitle">현황</h2>
            <div id="rosterBody" class="roster"></div>
            <div class="dlg-actions">
                <button class="nav-btn" id="rosterClose">닫기</button>
            </div>
        </div>
    </dialog>

    <!-- 접속 직후 안내: 안 읽은 공지 · 투표 안 한 공지 -->
    <dialog id="todoDlg" class="dlg">
        <div class="dlg-form">
            <h2 id="todoTitle">확인할 공지</h2>
            <div id="todoBody" class="todo-list"></div>
            <div class="dlg-actions">
                <button class="nav-btn" id="todoClose">나중에</button>
            </div>
        </div>
    </dialog>

    <!-- 일정 작성·수정 -->
    <dialog id="eventDlg" class="dlg">
        <form class="dlg-form" id="eventForm" method="dialog">
            <h2 id="eventDlgTitle">일정 추가</h2>
            <label class="f"><span>제목</span>
                <input id="eTitle" maxlength="40" required placeholder="예) 정기 검사">
            </label>
            <div class="f-row">
                <label class="f"><span>시작</span><input type="date" id="eFrom" required></label>
                <label class="f"><span>종료 <i>선택</i></span><input type="date" id="eTo"></label>
            </div>
            <label class="f"><span>색</span>
                <select id="eColor">
                    <option value="blue">파랑</option>
                    <option value="green">초록</option>
                    <option value="orange">주황</option>
                    <option value="pink">분홍</option>
                    <option value="purple">보라</option>
                    <option value="teal">청록</option>
                </select>
            </label>
            <div class="dlg-actions">
                <button type="button" class="link-btn danger" id="eventDelete" hidden>삭제</button>
                <span class="grow"></span>
                <button type="submit" value="cancel" class="nav-btn" formnovalidate>취소</button>
                <button type="submit" value="ok" class="nav-btn accent">저장</button>
            </div>
        </form>
    </dialog>
</body>
</html>
