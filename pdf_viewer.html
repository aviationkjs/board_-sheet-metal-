<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FT-200 PowerPak Field Guide - PDF 뷰어</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="tokens.css?v=20261116">
    <link rel="stylesheet" href="header.css?v=20261116">
    <link rel="stylesheet" href="pages.css?v=20261116">
    <style>
        .container { max-width: 900px; }
        /* 페이지 넘기기 막대: 헤더 아래에 붙어 따라옵니다 */
        .controls {
            position: sticky;
            top: 61px;
            z-index: 50;
            display: flex;
            gap: var(--spacing-2);
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            padding: var(--spacing-2) var(--spacing-4);
            background: var(--color-background-surface);
            border-bottom: 1px solid var(--color-border-emphasized);
        }
        .page-input-group {
            display: flex;
            gap: var(--spacing-1);
            align-items: center;
        }
        .page-input-group .field {
            width: 92px;
            text-align: center;
        }
        .page-info {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            white-space: nowrap;
        }
        #pdfContainer {
            background: #FFFFFF;
            border-radius: var(--radius-container);
            box-shadow: var(--shadow-low);
            overflow: hidden;
        }
        #pdfCanvas {
            display: block;
            width: 100%;
            height: auto;
            margin: 0 auto;
        }
        .error {
            background: var(--color-error-muted);
            color: var(--color-text-error);
            padding: var(--spacing-4);
            border-radius: var(--radius-element);
            margin: var(--spacing-4) 0;
        }
        @media (max-width: 600px) {
            .controls { top: 53px; padding: var(--spacing-2) var(--spacing-3); }
        }
    </style>
</head>
<body>
    <header>
        <a href="index.html" class="back-btn">← 보드</a>
        <h1 class="page-title">FT-200 Guide</h1>
        <div></div>
    </header>

    <div class="controls">
        <button class="btn" id="prevBtn" onclick="previousPage()">← 이전</button>
        <div class="page-input-group">
            <input type="number" id="pageInput" class="field" min="1" placeholder="페이지">
            <button class="btn" onclick="goToPage()">이동</button>
        </div>
        <button class="btn" id="nextBtn" onclick="nextPage()">다음 →</button>
        <div class="page-info">
            <span id="pageInfo">페이지 로딩 중...</span>
        </div>
    </div>

    <div class="container">
        <div id="pdfContainer">
            <canvas id="pdfCanvas"></canvas>
        </div>
        <div id="errorContainer"></div>
    </div>
    
    <script>
        // PDF.js 워커 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        
        let pdfDoc = null;
        let currentPage = 1;
        let totalPages = 0;
        
        const canvas = document.getElementById('pdfCanvas');
        const ctx = canvas.getContext('2d');
        const pageInput = document.getElementById('pageInput');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const errorContainer = document.getElementById('errorContainer');
        
        // PDF 로드
        async function loadPDF() {
            try {
                const pdfUrl = 'FT-200_PowerPak_Field_Guide.pdf';
                pdfDoc = await pdfjsLib.getDocument(pdfUrl).promise;
                totalPages = pdfDoc.numPages;
                pageInput.max = totalPages;
                renderPage(currentPage);
                updatePageInfo();
            } catch (error) {
                console.error('PDF 로드 오류:', error);
                errorContainer.innerHTML = '<div class="error">PDF 파일을 로드할 수 없습니다. 파일이 존재하는지 확인해 주세요.</div>';
            }
        }
        
        // 페이지 렌더링
        async function renderPage(pageNum) {
            try {
                if (pageNum < 1 || pageNum > totalPages) {
                    return;
                }
                
                currentPage = pageNum;
                const page = await pdfDoc.getPage(pageNum);
                
                // 캔버스 크기 설정
                const viewport = page.getViewport({ scale: 2 });
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                // 페이지 렌더링
                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };
                
                await page.render(renderContext).promise;
                updatePageInfo();
                updateButtonStates();
            } catch (error) {
                console.error('페이지 렌더링 오류:', error);
            }
        }
        
        // 페이지 정보 업데이트
        function updatePageInfo() {
            pageInfo.textContent = `${currentPage} / ${totalPages}`;
            pageInput.value = currentPage;
        }
        
        // 버튼 상태 업데이트
        function updateButtonStates() {
            prevBtn.disabled = currentPage <= 1;
            nextBtn.disabled = currentPage >= totalPages;
        }
        
        // 이전 페이지
        window.previousPage = () => {
            if (currentPage > 1) {
                renderPage(currentPage - 1);
            }
        };
        
        // 다음 페이지
        window.nextPage = () => {
            if (currentPage < totalPages) {
                renderPage(currentPage + 1);
            }
        };
        
        // 특정 페이지로 이동
        window.goToPage = () => {
            const pageNum = parseInt(pageInput.value);
            if (!isNaN(pageNum) && pageNum >= 1 && pageNum <= totalPages) {
                renderPage(pageNum);
            } else {
                alert(`1부터 ${totalPages}까지의 페이지 번호를 입력하세요.`);
                pageInput.value = currentPage;
            }
        };
        
        // Enter 키로 페이지 이동
        pageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                window.goToPage();
            }
        });
        
        // 페이지 로드 시 PDF 로드
        window.addEventListener('load', loadPDF);
    </script>
</body>
</html>
