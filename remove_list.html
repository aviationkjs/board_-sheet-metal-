<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자재 재고 · 소모 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16181c; --panel:#1e2127; --panel-2:#23272f; --line:#2c3038; --line-2:#363b45;
    --text:#e6e8ec; --muted:#8b909a; --amber:#ffb020; --amber-dim:#3a2f14;
    --danger:#ff5a52; --danger-dim:#3a1c1a; --ok:#4ade80; --ok-dim:#16301f;
    --sans:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}

  .statusbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);
    border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;letter-spacing:.04em;
    position:sticky;top:0;z-index:20}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);animation:pulse 2.4s infinite}
  @keyframes pulse{50%{opacity:.35}}
  .statusbar .sys{color:var(--muted)} .statusbar .sys b{color:var(--text);font-weight:600}
  .statusbar .clock{margin-left:auto;color:var(--amber)}

  .wrap{max-width:1180px;margin:0 auto;padding:22px 16px 64px}
  .toolbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
  .back{background:none;border:1px solid var(--line);color:var(--muted);font-family:var(--mono);
    font-size:12px;padding:9px 14px;border-radius:8px;cursor:pointer;text-decoration:none}
  .back:hover{color:var(--text);border-color:var(--line-2)}
  .toolbar h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .count{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--panel);
    border:1px solid var(--line);padding:5px 10px;border-radius:20px}
  .role-tag{font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:20px;
    background:var(--amber-dim);color:var(--amber);letter-spacing:.04em}
  .btn-add{margin-left:auto;background:var(--amber);color:#1a1400;font-weight:600;border:none;
    padding:11px 18px;border-radius:8px;cursor:pointer;font-size:14px}
  .legend{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:14px}
  .legend b{color:var(--danger)}

  .table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:14px;min-width:780px}
  thead th{background:var(--panel-2);text-align:left;padding:12px 14px;font-family:var(--mono);
    font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;
    border-bottom:1px solid var(--line);white-space:nowrap}
  tbody td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:rgba(255,255,255,.02)}
  .c-seq{font-family:var(--mono);color:var(--muted);text-align:center;width:44px}
  .c-mono{font-family:var(--mono)}
  .c-qty{font-family:var(--mono);font-size:16px;font-weight:600;color:var(--text)}
  .c-qty .unit{font-size:11px;color:var(--muted);margin-left:3px;font-weight:400}
  tr.low .c-qty{color:var(--danger)}
  .low-badge{display:inline-block;margin-left:6px;font-size:10px;font-family:var(--mono);
    background:var(--danger-dim);color:var(--danger);padding:2px 6px;border-radius:5px;letter-spacing:.04em}
  .pending{display:flex;align-items:center;gap:8px}
  .pending .num{font-family:var(--mono);font-weight:600;color:var(--amber);min-width:20px}
  .spark{display:block}
  .spark-empty{color:var(--line-2);font-family:var(--mono)}

  .consume-btn{background:var(--amber);color:#1a1400;border:none;font-weight:700;font-size:14px;
    padding:8px 14px;border-radius:8px;cursor:pointer}
  .consume-btn:hover{filter:brightness(1.05)}
  .mine{display:inline-flex;align-items:center;gap:6px;margin-left:8px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .cancel-btn{background:var(--panel-2);border:1px solid var(--line-2);color:var(--text);
    width:26px;height:26px;border-radius:6px;cursor:pointer;font-size:14px;line-height:1}

  .mgr-pending{display:flex;flex-direction:column;gap:5px;margin-bottom:6px}
  .mgr-req{display:flex;align-items:center;gap:6px;font-size:12px}
  .mgr-req .w{font-family:var(--mono);color:var(--text)}
  .mgr-req .n{font-family:var(--mono);color:var(--amber)}
  .mini{border:none;border-radius:5px;padding:3px 8px;font-size:11px;font-weight:600;cursor:pointer}
  .mini.ok{background:var(--ok-dim);color:var(--ok)}
  .mini.ok:hover{background:#1c3d28}
  .mini.rej{background:var(--danger-dim);color:var(--danger)}
  .mgr-item{display:flex;gap:6px;margin-top:2px}
  .mini.edit{background:var(--panel-2);color:var(--muted);border:1px solid var(--line-2)}
  .mini.del{background:var(--danger-dim);color:var(--danger)}
  .no-pending{color:var(--line-2);font-family:var(--mono);font-size:12px}

  .empty{padding:56px 20px;text-align:center;color:var(--muted)}
  .empty .ico{font-size:38px;opacity:.5} .empty p{margin-top:12px;font-size:14px} .empty span{color:var(--amber)}

  .hist{margin-top:26px}
  .hist-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
  .hist h3{font-size:13px;font-family:var(--mono);color:var(--muted);text-transform:uppercase;
    letter-spacing:.08em}
  .hist-reset{background:var(--danger-dim);color:var(--danger);border:1px solid var(--danger);
    font-family:var(--mono);font-size:11px;padding:6px 12px;border-radius:8px;cursor:pointer;letter-spacing:.04em}
  .hist-reset:hover{background:#4a2320}
  .hist-list{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 16px}
  .hist-item{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  .hist-item:last-child{border-bottom:none}
  .hist-item .ts{color:var(--muted);font-family:var(--mono);font-size:12px}
  .hist-empty{color:var(--muted);text-align:center;padding:20px;font-size:13px}

  .overlay{position:fixed;inset:0;background:rgba(8,9,11,.72);backdrop-filter:blur(3px);
    display:none;align-items:flex-end;justify-content:center;z-index:50}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line-2);border-radius:16px 16px 0 0;
    width:100%;max-width:520px;padding:24px 20px 28px}
  .modal h3{font-size:18px;margin-bottom:20px}
  .field{margin-bottom:16px}
  .field label{display:block;font-size:12px;color:var(--muted);font-family:var(--mono);
    letter-spacing:.05em;margin-bottom:7px;text-transform:uppercase}
  .field input{width:100%;background:var(--bg);border:1px solid var(--line-2);color:var(--text);
    padding:12px 13px;border-radius:9px;font-size:15px;font-family:var(--sans)}
  .field input:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-dim)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal-actions{display:flex;gap:10px;margin-top:22px}
  .modal-actions button{flex:1;padding:13px;border-radius:9px;font-size:15px;font-weight:600;cursor:pointer;border:none}
  .cancel{background:var(--panel-2);color:var(--text);border:1px solid var(--line-2)!important}
  .save{background:var(--amber);color:#1a1400}

  @media(min-width:560px){.overlay{align-items:center}.modal{border-radius:16px}}
</style>
</head>
<body>

<div class="statusbar">
  <span class="dot"></span>
  <span class="sys">SYSTEM · <b>자재 재고·소모</b> · 작업자 <b id="sbUser">—</b></span>
  <span class="clock" id="clock">--:--:--</span>
</div>

<div class="wrap">
  <div class="toolbar">
    <a class="back" href="index.html">← 스티커 보드로</a>
    <h2>자재 재고 · 소모</h2>
    <span class="count" id="count">0 항목</span>
    <span class="role-tag" id="roleTag" style="display:none;">담당자</span>
    <button class="btn-add" id="addBtn" style="display:none;">＋ 항목 추가</button>
  </div>
  <div class="legend">소모자: <b style="color:var(--amber)">[소모]</b> 1회=1개 누적 · 잘못 눌렀으면 취소(−1) · 담당자 <b style="color:var(--ok)">[확인·감산]</b> 시 전체수량 차감 · 저재고 기준 <b>≤ 3</b></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>순번</th><th>재고번호</th><th>파트넘버</th><th>전체수량</th>
          <th>대기소모 수량</th><th>소모</th>
          <th id="mgrHead" style="display:none;">관리 (담당자)</th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div class="empty" id="empty" style="display:none;">
      <div class="ico">📦</div>
      <p>등록된 재고 항목이 없습니다. <span>담당자가 ＋항목 추가</span>로 시작하세요.</p>
    </div>
  </div>

  <div class="hist">
    <div class="hist-head">
      <h3>최근 소모 이력 (승인·감산)</h3>
      <button id="resetHistBtn" class="hist-reset" style="display:none;">🗑 이력 초기화</button>
    </div>
    <div class="hist-list"><div id="histBody" class="hist-empty">이력이 없습니다.</div></div>
  </div>
</div>

<!-- 항목 추가 모달 -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h3>재고 항목 추가</h3>
    <div class="row2">
      <div class="field"><label>재고번호</label><input type="text" id="fStock" placeholder="예: A-100"></div>
      <div class="field"><label>파트넘버</label><input type="text" id="fPart" placeholder="예: 3277"></div>
    </div>
    <div class="row2">
      <div class="field"><label>전체수량</label><input type="number" id="fQty" min="0" value="0"></div>
      <div class="field"><label>단위(선택)</label><input type="text" id="fUnit" placeholder="개, EA …"></div>
    </div>
    <div class="modal-actions">
      <button class="cancel" id="mCancel">취소</button>
      <button class="save" id="mSave">추가</button>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getDatabase, ref, onValue, get, push, update, remove, runTransaction
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsOQMj6GTx1GVJVqjurZGlk0c1v1MjNOk",
  authDomain: "board-sheet-metal.firebaseapp.com",
  databaseURL: "https://board-sheet-metal-default-rtdb.firebaseio.com",
  projectId: "board-sheet-metal",
  storageBucket: "board-sheet-metal.firebasestorage.app",
  messagingSenderId: "300454183349",
  appId: "1:300454183349:web:7a5e681d9c6c1f7b5999fc"
};
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const LOW_STOCK = 3;
const MC = "materialConsumption";

/* ---- 로그인 강제 ---- */
const username = localStorage.getItem("username");
if (!username) { window.location.href = "auth.html"; }

/* ---- 권한: 관리자 또는 자재소모 부관리자 ---- */
let canManage = username === "admin";
try {
  const meSnap = await get(ref(db, "users/" + username));
  if (meSnap.exists() && meSnap.val().materialAdmin === true) canManage = true;
} catch (e) { /* users 읽기 실패 시 기본 권한 유지 */ }

/* ---- 상태 ---- */
let itemsData = {};
let requestsData = {};
let historyData = {};

/* ---- 유틸 ---- */
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(ts){ return ts ? new Date(ts).toLocaleString('ko-KR') : '-'; }
function tickClock(){ const d=new Date(),p=n=>String(n).padStart(2,"0");
  document.getElementById("clock").textContent=`${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`; }
setInterval(tickClock,1000); tickClock();

async function recordLog(action, details){
  try{
    const t = Date.now() + Math.floor(Math.random()*100000);
    await update(ref(db, "logs/" + t), { user: username, action, details: details||null, timestamp: Date.now() });
  }catch(e){ console.error("로그 기록 오류:", e); }
}

/* ---- 스파크라인 (최근 소모 추이, 꺾은선형 · 인라인 SVG) ---- */
function sparkline(itemId){
  const vals = Object.values(historyData)
    .filter(h => h.itemId === itemId)
    .sort((a,b) => a.timestamp - b.timestamp)
    .slice(-12)
    .map(h => Number(h.qty)||0);
  if(!vals.length) return '<span class="spark-empty">—</span>';
  const w=84, h=22, pad=3, n=vals.length;
  const max=Math.max(...vals), min=Math.min(...vals), range=(max-min)||1;
  const x = i => n===1 ? w/2 : pad + (i*(w-2*pad))/(n-1);
  const y = v => (h-pad) - ((v-min)/range)*(h-2*pad);
  const lastX = x(n-1).toFixed(1), lastY = y(vals[n-1]).toFixed(1);
  if(n===1){
    return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="최근 소모 추이"><circle cx="${(w/2).toFixed(1)}" cy="${(h/2).toFixed(1)}" r="2.2" fill="var(--amber)"/></svg>`;
  }
  const pts = vals.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-label="최근 소모 추이">`
    + `<polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>`
    + `<circle cx="${lastX}" cy="${lastY}" r="1.8" fill="var(--amber)"/></svg>`;
}

/* ---- 렌더 ---- */
function itemList(){
  return Object.entries(itemsData)
    .map(([id,v]) => ({ id, ...v }))
    .sort((a,b) => (a.seq||0)-(b.seq||0) || (a.createdAt||0)-(b.createdAt||0));
}

function render(){
  document.getElementById("sbUser").textContent = username;
  document.getElementById("roleTag").style.display = canManage ? "" : "none";
  document.getElementById("addBtn").style.display = canManage ? "" : "none";
  document.getElementById("mgrHead").style.display = canManage ? "" : "none";

  const items = itemList();
  document.getElementById("count").textContent = items.length + " 항목";
  const tbody = document.getElementById("tbody");
  const empty = document.getElementById("empty");

  if(!items.length){ tbody.innerHTML=""; empty.style.display="block"; return; }
  empty.style.display="none";

  tbody.innerHTML = items.map((it,idx)=>{
    const reqs = requestsData[it.id] || {};
    const totalPending = Object.values(reqs).reduce((s,r)=>s+(Number(r&&r.count)||0),0);
    const myCount = Number(reqs[username] && reqs[username].count) || 0;
    const low = (Number(it.qty)||0) <= LOW_STOCK;

    const mine = myCount>0
      ? `<span class="mine">내 소모 <b style="color:var(--amber)">${myCount}</b>
           <button class="cancel-btn" data-act="cancel" data-id="${it.id}" title="취소 -1">−</button></span>`
      : "";

    let mgrCell = "";
    if(canManage){
      const workers = Object.entries(reqs).filter(([,r])=>(Number(r&&r.count)||0)>0);
      const reqRows = workers.length
        ? `<div class="mgr-pending">` + workers.map(([w,r])=>`
            <div class="mgr-req">
              <span class="w">${esc(w)}</span> <span class="n">×${Number(r.count)||0}</span>
              <button class="mini ok" data-act="confirm" data-id="${it.id}" data-w="${esc(w)}">확인·감산</button>
              <button class="mini rej" data-act="reject" data-id="${it.id}" data-w="${esc(w)}">반려</button>
            </div>`).join("") + `</div>`
        : `<div class="no-pending">대기 없음</div>`;
      mgrCell = `<td>${reqRows}
        <div class="mgr-item">
          <button class="mini edit" data-act="edit" data-id="${it.id}">재고수정</button>
          <button class="mini del" data-act="delitem" data-id="${it.id}">삭제</button>
        </div></td>`;
    }

    return `<tr class="${low?'low':''}">
      <td class="c-seq">${idx+1}</td>
      <td class="c-mono">${esc(it.stockNo)}</td>
      <td class="c-mono">${esc(it.partNo)}</td>
      <td class="c-qty">${Number(it.qty)||0}<span class="unit">${esc(it.unit||"")}</span>${low?'<span class="low-badge">저재고</span>':''}</td>
      <td><div class="pending"><span class="num">${totalPending}</span>${sparkline(it.id)}</div></td>
      <td><button class="consume-btn" data-act="consume" data-id="${it.id}">소모</button>${mine}</td>
      ${mgrCell}
    </tr>`;
  }).join("");

  tbody.querySelectorAll("button[data-act]").forEach(btn=>{
    const act=btn.dataset.act, id=btn.dataset.id, w=btn.dataset.w;
    btn.onclick=()=>{
      if(act==="consume") consumeItem(id);
      else if(act==="cancel") cancelItem(id);
      else if(act==="confirm") confirmConsume(id,w);
      else if(act==="reject") rejectConsume(id,w);
      else if(act==="edit") editStock(id);
      else if(act==="delitem") deleteItem(id);
    };
  });
}

function renderHistory(){
  const el = document.getElementById("histBody");
  const entries = Object.values(historyData).sort((a,b)=>b.timestamp-a.timestamp).slice(0,15);
  if(!entries.length){ el.className="hist-empty"; el.textContent="이력이 없습니다."; return; }
  el.className="";
  el.innerHTML = entries.map(h=>`
    <div class="hist-item">
      <span><b>${esc(h.worker)}</b> — ${esc(h.stockNo)} / ${esc(h.partNo)} <b style="color:var(--amber)">${Number(h.qty)||0}</b> 소모 <span style="color:var(--muted)">(승인: ${esc(h.approver)})</span></span>
      <span class="ts">${fmt(h.timestamp)}</span>
    </div>`).join("");
}

/* ---- 소모자 동작 ---- */
async function consumeItem(id){
  try{
    await runTransaction(ref(db, `${MC}/requests/${id}/${username}`),
      n => ({ count: ((n && n.count) || 0) + 1, updatedAt: Date.now() }));
  }catch(e){ console.error("소모 오류:", e); alert("소모 처리 실패: "+e.message); }
}
async function cancelItem(id){
  try{
    await runTransaction(ref(db, `${MC}/requests/${id}/${username}`),
      n => { if(!n) return n; const c=(n.count||0)-1; return c>0 ? { count:c, updatedAt:Date.now() } : null; });
  }catch(e){ console.error("취소 오류:", e); alert("취소 실패: "+e.message); }
}

/* ---- 담당자 동작 ---- */
async function confirmConsume(id, worker){
  if(!canManage) return;
  const it = itemsData[id]; if(!it) return;
  const c = Number(requestsData[id] && requestsData[id][worker] && requestsData[id][worker].count) || 0;
  if(!c){ return; }
  const stock = Number(it.qty)||0;
  let msg = `${worker}님의 '${it.stockNo}/${it.partNo}' 소모 ${c}개를 확인·감산할까요?\n현재고 ${stock} → ${Math.max(0, stock-c)}`;
  if(c > stock) msg += `\n⚠ 소모가 재고보다 많습니다. 재고는 0으로 처리됩니다.`;
  if(!confirm(msg)) return;
  try{
    await runTransaction(ref(db, `${MC}/items/${id}`), item=>{
      if(!item) return item;
      item.qty = Math.max(0, (Number(item.qty)||0) - c);
      return item;
    });
    await remove(ref(db, `${MC}/requests/${id}/${worker}`));
    await push(ref(db, `${MC}/history`), {
      itemId:id, stockNo:it.stockNo, partNo:it.partNo, worker, qty:c, approver:username, timestamp:Date.now()
    });
    await recordLog("MATERIAL_CONFIRM", { itemId:id, stockNo:it.stockNo, partNo:it.partNo, worker, qty:c });
  }catch(e){ console.error("확인·감산 오류:", e); alert("처리 실패: "+e.message); }
}
async function rejectConsume(id, worker){
  if(!canManage) return;
  const c = Number(requestsData[id] && requestsData[id][worker] && requestsData[id][worker].count) || 0;
  if(!confirm(`${worker}님의 대기 소모 ${c}개를 감산 없이 반려(삭제)할까요?`)) return;
  try{
    await remove(ref(db, `${MC}/requests/${id}/${worker}`));
    await recordLog("MATERIAL_REJECT", { itemId:id, worker, qty:c });
  }catch(e){ console.error("반려 오류:", e); alert("반려 실패: "+e.message); }
}
async function editStock(id){
  if(!canManage) return;
  const it = itemsData[id]; if(!it) return;
  const v = prompt(`'${it.stockNo}/${it.partNo}' 전체수량(재고) 수정`, Number(it.qty)||0);
  if(v===null) return;
  const n = parseInt(v,10);
  if(isNaN(n) || n<0){ alert("0 이상의 숫자를 입력하세요."); return; }
  try{
    await update(ref(db, `${MC}/items/${id}`), { qty:n });
    await recordLog("MATERIAL_EDIT_STOCK", { itemId:id, stockNo:it.stockNo, from:Number(it.qty)||0, to:n });
  }catch(e){ console.error("재고수정 오류:", e); alert("수정 실패: "+e.message); }
}
async function deleteItem(id){
  if(!canManage) return;
  const it = itemsData[id]; if(!it) return;
  if(!confirm(`'${it.stockNo}/${it.partNo}' 항목을 삭제할까요?\n(대기 소모도 함께 삭제됩니다)`)) return;
  try{
    await remove(ref(db, `${MC}/items/${id}`));
    await remove(ref(db, `${MC}/requests/${id}`));
    await recordLog("MATERIAL_DELETE_ITEM", { itemId:id, stockNo:it.stockNo, partNo:it.partNo });
  }catch(e){ console.error("삭제 오류:", e); alert("삭제 실패: "+e.message); }
}

/* ---- 항목 추가 모달 ---- */
const overlay = document.getElementById("overlay");
document.getElementById("addBtn").onclick = ()=>{
  document.getElementById("fStock").value="";
  document.getElementById("fPart").value="";
  document.getElementById("fQty").value="0";
  document.getElementById("fUnit").value="";
  overlay.classList.add("open");
};
document.getElementById("mCancel").onclick = ()=>overlay.classList.remove("open");
overlay.addEventListener("click", e=>{ if(e.target.id==="overlay") overlay.classList.remove("open"); });
document.getElementById("mSave").onclick = async ()=>{
  if(!canManage) return;
  const stockNo = document.getElementById("fStock").value.trim();
  const partNo  = document.getElementById("fPart").value.trim();
  const qty     = parseInt(document.getElementById("fQty").value,10);
  const unit    = document.getElementById("fUnit").value.trim();
  if(!stockNo){ alert("재고번호를 입력하세요."); return; }
  if(!partNo){ alert("파트넘버를 입력하세요."); return; }
  if(isNaN(qty) || qty<0){ alert("전체수량은 0 이상의 숫자여야 합니다."); return; }
  const seq = itemList().reduce((m,it)=>Math.max(m, Number(it.seq)||0), 0) + 1;
  try{
    await push(ref(db, `${MC}/items`), { seq, stockNo, partNo, qty, unit, createdAt:Date.now(), createdBy:username });
    await recordLog("MATERIAL_ADD_ITEM", { stockNo, partNo, qty });
    overlay.classList.remove("open");
  }catch(e){ console.error("항목 추가 오류:", e); alert("추가 실패: "+e.message); }
};

/* ---- 소모 이력 초기화: 주관리자(admin)만. 되돌릴 수 없음. ---- */
const resetHistBtn = document.getElementById("resetHistBtn");
if (username === "admin") resetHistBtn.style.display = "";
resetHistBtn.onclick = async () => {
  if (username !== "admin") return;
  const n = Object.keys(historyData).length;
  if (!confirm(`최근 소모 이력 ${n}건을 모두 삭제할까요?\n(등록 항목·대기 소모는 유지됩니다. 되돌릴 수 없습니다.)`)) return;
  try {
    await remove(ref(db, `${MC}/history`));
    await recordLog("MATERIAL_RESET_HISTORY", { cleared: n });
  } catch(e){ console.error("이력 초기화 오류:", e); alert("초기화 실패: "+e.message); }
};

/* ---- 실시간 리스너 ---- */
onValue(ref(db, `${MC}/items`), snap=>{ itemsData = snap.val() || {}; render(); });
onValue(ref(db, `${MC}/requests`), snap=>{ requestsData = snap.val() || {}; render(); });
onValue(ref(db, `${MC}/history`), snap=>{ historyData = snap.val() || {}; render(); renderHistory(); });
</script>
</body>
