<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성능기골 스티커 보드 - 인증</title>
    <link rel="stylesheet" href="tokens.css?v=20261115">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            font-size: var(--font-size-base);
            background: var(--color-background-body);
            color: var(--color-text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: var(--spacing-4);
        }

        .auth-container {
            background: var(--color-background-surface);
            border-radius: var(--radius-container);
            box-shadow: var(--shadow-low);
            width: 100%;
            max-width: 400px;
            padding: var(--spacing-8);
        }

        /* 제목 위 작은 표시 */
        .brand-mark {
            width: 48px;
            height: 48px;
            margin: 0 auto var(--spacing-4);
            border-radius: var(--radius-container);
            background: var(--color-accent);
            color: var(--color-on-accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-semibold);
            letter-spacing: -0.5px;
        }

        .auth-container h1 {
            text-align: center;
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            line-height: 32px;
            margin-bottom: var(--spacing-1);
            color: var(--color-text-primary);
        }

        .auth-container p {
            text-align: center;
            color: var(--color-text-secondary);
            margin-bottom: var(--spacing-6);
            font-size: var(--font-size-base);
            line-height: 20px;
        }

        .form-group {
            margin-bottom: var(--spacing-4);
        }

        .form-group label {
            display: block;
            margin-bottom: var(--spacing-2);
            font-weight: var(--font-weight-medium);
            color: var(--color-text-primary);
            font-size: var(--font-size-base);
        }

        .form-group input {
            width: 100%;
            height: 44px;
            padding: 0 var(--spacing-3);
            border: 1px solid var(--color-border-emphasized);
            border-radius: var(--radius-element);
            background: var(--color-background-surface);
            color: var(--color-text-primary);
            font-family: inherit;
            font-size: var(--font-size-input);
            transition: border-color var(--duration-fast), box-shadow var(--duration-fast);
            letter-spacing: 0.5px;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--color-accent);
            box-shadow: var(--shadow-focus);
        }

        .form-group input::placeholder {
            color: var(--color-text-disabled);
            letter-spacing: normal;
        }

        .form-group input:disabled {
            background: var(--color-background-muted);
            color: var(--color-text-secondary);
        }

        .button-group {
            display: flex;
            gap: var(--spacing-2);
            margin-top: var(--spacing-6);
        }

        .button-group button {
            flex: 1;
            height: 44px;
            padding: 0 var(--spacing-4);
            border: none;
            border-radius: var(--radius-element);
            font-family: inherit;
            font-size: var(--font-size-base);
            font-weight: var(--font-weight-medium);
            cursor: pointer;
            transition: background var(--duration-fast);
        }

        .btn-primary {
            background: var(--color-accent);
            color: var(--color-on-accent);
        }

        .btn-primary:hover {
            background: var(--color-accent-hover);
        }

        .btn-primary:disabled {
            background: var(--color-neutral);
            color: var(--color-text-disabled);
            cursor: not-allowed;
        }

        .btn-secondary {
            background: transparent;
            color: var(--color-text-accent);
        }

        .btn-secondary:hover {
            background: var(--color-hover);
        }

        .error-message {
            color: var(--color-text-error);
            font-size: var(--font-size-sm);
            line-height: 20px;
            margin-top: var(--spacing-1);
            display: none;
        }

        .info-text {
            background: var(--color-accent-muted);
            color: var(--color-text-info);
            padding: var(--spacing-3);
            border-radius: var(--radius-element);
            font-size: var(--font-size-sm);
            margin-bottom: var(--spacing-4);
            line-height: 20px;
        }

        .info-text.setup {
            background: var(--color-success-muted);
            color: var(--color-text-success);
        }

        .user-count {
            background: var(--color-background-muted);
            color: var(--color-text-secondary);
            padding: var(--spacing-2) var(--spacing-3);
            border-radius: var(--radius-element);
            font-size: var(--font-size-sm);
            line-height: 20px;
            margin-bottom: var(--spacing-4);
            text-align: center;
        }

        .user-count:empty {
            display: none;
        }

        .user-count.full {
            background: var(--color-error-muted);
            color: var(--color-text-error);
        }

        .forgot-hint {
            text-align: center;
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin-top: var(--spacing-4);
        }

        @media (max-width: 600px) {
            .auth-container {
                padding: var(--spacing-6);
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="brand-mark" aria-hidden="true">성능</div>
        <h1>성능기골 스티커 보드</h1>
        <p>아이디와 PIN으로 접속하세요</p>

        <div class="info-text" id="infoText">
            아이디와 4자리 PIN을 입력하세요.<br>
            처음이면 PIN을 새로 설정하게 됩니다.
        </div>

        <div class="user-count" id="userCountDisplay"></div>

        <div class="form-group">
            <label for="userid">아이디</label>
            <input type="text" id="userid" placeholder="아이디 입력" autocomplete="off" autofocus>
            <div class="error-message" id="useridError"></div>
        </div>

        <div class="form-group">
            <label for="pin">PIN (4자리 숫자)</label>
            <input type="password" id="pin" placeholder="••••" inputmode="numeric" maxlength="4" autocomplete="off">
            <div class="error-message" id="pinError"></div>
        </div>

        <div class="form-group" id="pinConfirmGroup" style="display:none;">
            <label for="pinConfirm">PIN 확인 (한 번 더 입력)</label>
            <input type="password" id="pinConfirm" placeholder="••••" inputmode="numeric" maxlength="4" autocomplete="off">
            <div class="error-message" id="pinConfirmError"></div>
        </div>

        <div class="button-group">
            <button class="btn-primary" id="submitBtn">접속</button>
        </div>

        <div class="forgot-hint">
            PIN을 잊으셨나요? 관리자에게 초기화를 요청하세요.
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import {
            getDatabase,
            ref,
            get,
            set,
            update
        } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBsOQMj6GTx1GVJVqjurZGlk0c1v1MjNOk",
            authDomain: "board-sheet-metal.firebaseapp.com",
            databaseURL: "https://board-sheet-metal-default-rtdb.firebaseio.com",
            projectId: "board-sheet-metal",
            storageBucket: "board-sheet-metal.firebasestorage.app",
            messagingSenderId: "300454183349",
            appId: "1:300454183349:web:7a5e681d9c6c1f7b5999fc"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const MAX_USERS = 28;

        // 'login' = 아이디+PIN 확인 / 'setup' = 최초 PIN 설정(확인 입력 포함)
        let mode = 'login';

        const useridEl = document.getElementById('userid');
        const pinEl = document.getElementById('pin');
        const pinConfirmGroup = document.getElementById('pinConfirmGroup');
        const pinConfirmEl = document.getElementById('pinConfirm');
        const submitBtn = document.getElementById('submitBtn');
        const infoText = document.getElementById('infoText');

        function clearErrors() {
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.textContent = '';
            });
        }

        function showError(elementId, message) {
            const el = document.getElementById(elementId);
            el.textContent = message;
            el.style.display = 'block';
        }

        // Firebase 키로 쓸 수 없는 문자 검사
        function isValidId(id) {
            return id.length >= 2 && !/[.#$\[\]/]/.test(id);
        }

        function isValidPin(pin) {
            return /^\d{4}$/.test(pin);
        }

        // SHA-256(id + ":" + pin) → 16진수 문자열(64자)
        async function pinHash(id, pin) {
            const data = new TextEncoder().encode(`${id}:${pin}`);
            const buf = await crypto.subtle.digest("SHA-256", data);
            return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
        }

        // 적응형 PIN 검증
        //  - secrets 읽기가 허용되면(규칙 미강화 상태) 로컬 해시 비교
        //  - 읽기가 차단되면(규칙 강화 상태) loginProbe 쓰기 성공 여부로 검증(verify-by-write)
        async function verifyPin(id, pin) {
            const hash = await pinHash(id, pin);
            try {
                const snap = await get(ref(db, `secrets/${id}/pinHash`));
                return snap.exists() && snap.val() === hash;
            } catch (readErr) {
                try {
                    await set(ref(db, `secrets/${id}/loginProbe`), hash);
                    return true;
                } catch (writeErr) {
                    return false;
                }
            }
        }

        async function getUserCount() {
            const snap = await get(ref(db, 'users'));
            return snap.exists() ? Object.keys(snap.val()).length : 0;
        }

        async function updateUserCount() {
            try {
                const count = await getUserCount();
                const el = document.getElementById('userCountDisplay');
                el.textContent = '등록된 사용자: ' + count + ' / ' + MAX_USERS;
                if (count >= MAX_USERS) {
                    el.classList.add('full');
                    el.innerHTML += '<br><strong>정원이 찼습니다. 관리자에게 문의하세요.</strong>';
                }
            } catch (e) {
                console.error('사용자 수 조회 오류:', e);
            }
        }

        async function recordLog(user, action, details) {
            try {
                const ts = Date.now() + Math.floor(Math.random() * 100000);
                await set(ref(db, 'logs/' + ts), {
                    user, action, details: details || null, timestamp: Date.now()
                });
            } catch (e) {
                console.error('로그 기록 오류:', e);
            }
        }

        function finishLogin(id) {
            localStorage.setItem('username', id);
            window.location.href = 'index.html';
        }

        // setup 모드로 전환 (최초 PIN 설정)
        function enterSetupMode() {
            mode = 'setup';
            useridEl.disabled = true;
            pinConfirmGroup.style.display = 'block';
            infoText.className = 'info-text setup';
            infoText.innerHTML = '새 PIN을 설정합니다.<br>위에 입력한 PIN을 아래에 한 번 더 입력하세요. (설정 후에는 관리자만 변경할 수 있습니다)';
            submitBtn.textContent = 'PIN 설정 & 접속';
            pinConfirmEl.focus();
        }

        function resetToLogin() {
            mode = 'login';
            useridEl.disabled = false;
            pinConfirmGroup.style.display = 'none';
            pinConfirmEl.value = '';
            infoText.className = 'info-text';
            infoText.innerHTML = '아이디와 4자리 PIN을 입력하세요.<br>처음이면 PIN을 새로 설정하게 됩니다.';
            submitBtn.textContent = '접속';
        }

        async function handleSubmit() {
            clearErrors();
            const id = useridEl.value.trim();
            const pin = pinEl.value.trim();

            if (!isValidId(id)) {
                showError('useridError', '아이디는 2자 이상이며 . # $ [ ] / 는 사용할 수 없습니다.');
                return;
            }
            if (!isValidPin(pin)) {
                showError('pinError', 'PIN은 4자리 숫자여야 합니다.');
                return;
            }

            submitBtn.disabled = true;
            try {
                if (mode === 'setup') {
                    await handleSetup(id, pin);
                } else {
                    await handleLogin(id, pin);
                }
            } catch (e) {
                console.error('처리 오류:', e);
                showError('pinError', '오류가 발생했습니다: ' + (e.message || '알 수 없는 오류'));
            } finally {
                submitBtn.disabled = false;
            }
        }

        async function handleLogin(id, pin) {
            const userSnap = await get(ref(db, 'users/' + id));
            const exists = userSnap.exists();
            const hasPin = exists && userSnap.val().hasPin === true;

            // 신규 계정 또는 PIN 미설정(기존 이관) 계정 → 최초 설정
            if (!exists || !hasPin) {
                if (!exists) {
                    const count = await getUserCount();
                    if (count >= MAX_USERS) {
                        showError('useridError', '정원(' + MAX_USERS + ')이 찼습니다. 관리자에게 문의하세요.');
                        return;
                    }
                }
                enterSetupMode();
                return;
            }

            const ok = await verifyPin(id, pin);
            if (!ok) {
                showError('pinError', 'PIN이 올바르지 않습니다.');
                return;
            }

            await update(ref(db, 'users/' + id), { lastLogin: Date.now() });
            await recordLog(id, 'LOGIN');
            finishLogin(id);
        }

        async function handleSetup(id, pin) {
            const confirm = pinConfirmEl.value.trim();
            if (!isValidPin(confirm)) {
                showError('pinConfirmError', '확인 PIN도 4자리 숫자여야 합니다.');
                return;
            }
            if (pin !== confirm) {
                showError('pinConfirmError', 'PIN이 서로 일치하지 않습니다.');
                return;
            }

            const userSnap = await get(ref(db, 'users/' + id));
            const exists = userSnap.exists();
            if (exists && userSnap.val().hasPin === true) {
                // 이미 설정됨(경합) → 로그인 모드로
                showError('pinError', '이미 PIN이 설정된 계정입니다. 다시 로그인하세요.');
                resetToLogin();
                return;
            }
            if (!exists) {
                const count = await getUserCount();
                if (count >= MAX_USERS) {
                    showError('useridError', '정원(' + MAX_USERS + ')이 찼습니다. 관리자에게 문의하세요.');
                    resetToLogin();
                    return;
                }
            }

            const hash = await pinHash(id, pin);
            // pinHash 는 write-once 규칙 대상: 없을 때만 생성됨
            await set(ref(db, 'secrets/' + id + '/pinHash'), hash);

            const profile = { hasPin: true, lastLogin: Date.now() };
            if (!exists) profile.createdAt = Date.now();
            await update(ref(db, 'users/' + id), profile);

            await recordLog(id, 'SETUP_PIN');
            finishLogin(id);
        }

        window.addEventListener('load', async () => {
            const saved = localStorage.getItem('username');
            if (saved) {
                window.location.href = 'index.html';
                return;
            }
            await updateUserCount();
        });

        submitBtn.addEventListener('click', handleSubmit);

        // 아이디를 바꾸면 로그인 모드로 되돌림
        useridEl.addEventListener('input', () => {
            if (mode === 'setup') resetToLogin();
        });

        // 숫자만 허용
        [pinEl, pinConfirmEl].forEach(el => {
            el.addEventListener('input', () => {
                el.value = el.value.replace(/\D/g, '').slice(0, 4);
            });
        });

        // Enter 처리
        [useridEl, pinEl, pinConfirmEl].forEach(el => {
            el.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') handleSubmit();
            });
        });
    </script>
</body>
</html>
