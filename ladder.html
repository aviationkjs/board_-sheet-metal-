<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1F22" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="성능보드판">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" href="assets/icon-192.png">
<script src="pwa.js?v=20261124" defer></script>
<title>뽑기 · 조짜기</title>
<link rel="stylesheet" href="tokens.css?v=20261116">
<link rel="stylesheet" href="header.css?v=20261116">
<style>
  :root{
    --bg:var(--color-background-body); --panel:var(--color-background-surface);
    --panel-2:var(--color-background-subtle);
    --line:var(--color-border); --line-2:var(--color-border-emphasized);
    --text:var(--color-text-primary); --muted:var(--color-text-secondary);
    --amber:var(--color-accent); --amber-dim:var(--color-accent-muted); --amber-text:var(--color-text-accent);
    --danger:var(--color-error); --danger-dim:var(--color-error-muted); --danger-text:var(--color-text-error);
    --sans:var(--font-family);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
  button{font-family:inherit}

  .wrap{max-width:760px;margin:0 auto;padding:22px 16px 64px}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .panel-head{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .panel-head h3{font-size:11px;color:var(--muted);font-weight:500}
  .panel-head .cnt{font-size:13px;font-weight:600}
  .grow{flex:1}

  .btn{height:36px;padding:0 14px;border:none;border-radius:var(--radius-element);background:var(--color-neutral);
    color:var(--text);font-size:14px;font-weight:var(--font-weight-medium);cursor:pointer;white-space:nowrap;flex-shrink:0}
  .btn:hover{background:var(--line-2)}
  .btn.accent{background:var(--amber);color:var(--color-on-accent)}
  .btn.sm{height:30px;padding:0 10px;font-size:13px}
  .btn.big{width:100%;height:48px;font-size:16px;font-weight:600}
  .btn:disabled{opacity:.45;cursor:default}

  /* 참가자 칩 */
  .people{display:flex;flex-wrap:wrap;gap:6px}
  .person{height:34px;padding:0 12px;border-radius:var(--radius-full);border:1px solid var(--line);
    background:var(--panel-2);color:var(--muted);font-size:14px;cursor:pointer;white-space:nowrap;
    text-decoration:line-through;text-decoration-color:var(--line-2)}
  .person.on{background:var(--amber-dim);border-color:var(--amber);color:var(--amber-text);font-weight:600;text-decoration:none}
  .person.guest::after{content:" ✕";font-weight:400;opacity:.6}
  .add-row{display:flex;gap:6px;margin-top:12px}
  .add-row input{flex:1;min-width:0;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    font-family:inherit;font-size:16px;padding:7px 10px;border-radius:8px;outline:none}
  .add-row input:focus{border-color:var(--amber)}
  .note{font-size:12px;color:var(--muted);margin-top:10px}

  /* 방식 */
  .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
  .seg button{height:44px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);
    font-size:14px;cursor:pointer;white-space:nowrap}
  .seg button.on{border-color:var(--amber);background:var(--amber-dim);color:var(--amber-text);font-weight:600}
  @media (max-width:400px){ .seg button{font-size:13px} }

  /* 목록 */
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
  .row{display:flex;align-items:center;gap:8px;height:44px;padding:0 12px;border-radius:8px;background:var(--panel-2);
    border:1px solid var(--line);font-size:15px;transition:background .08s,border-color .08s,transform .15s;min-width:0}
  .row .no{font-size:11px;color:var(--muted);width:18px;flex-shrink:0}
  .row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
  .row .tag{margin-left:auto;font-size:12px;font-weight:700;white-space:nowrap}
  .row.flash{background:var(--amber-dim);border-color:var(--amber)}
  .row.hit{background:var(--danger-dim);border-color:var(--danger);transform:scale(1.03)}
  .row.hit .tag{color:var(--danger-text)}
  .row.safe{opacity:.55}

  .teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
  .team{border-radius:10px;border:1px solid var(--line);border-top:4px solid var(--c);background:var(--panel-2);padding:10px 12px;
    animation:pop .35s ease-out both}
  .team h4{font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .team h4 b{color:var(--text);font-size:15px;margin-right:4px}
  .team li{list-style:none;font-size:15px;padding:3px 0;font-weight:500}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.96)}to{opacity:1;transform:none}}

  .banner{text-align:center;font-size:20px;font-weight:700;margin:4px 0 14px;min-height:28px}
  .banner small{display:block;font-size:12px;font-weight:400;color:var(--muted);margin-top:4px}
  .empty{font-size:13px;color:var(--muted)}

  #fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:200}
</style>
</head>
<body>

<header>
  <a href="index.html" class="back-btn">← 보드</a>
  <h1 class="page-title">뽑기 · 조짜기</h1>
  <div class="header-side"><span class="header-clock" id="clock">--:--:--</span></div>
</header>

<canvas id="fx"></canvas>

<div class="wrap">
  <!-- 참가자 -->
  <div class="panel">
    <div class="panel-head">
      <h3>참가자</h3>
      <span class="cnt" id="cnt">-</span>
      <span class="grow"></span>
      <button class="btn sm" id="allOn">전체 선택</button>
      <button class="btn sm" id="allOff">전체 해제</button>
    </div>
    <div class="people" id="people"><div class="empty">회원 명단을 불러오는 중…</div></div>
    <div class="add-row">
      <input id="guest" maxlength="10" placeholder="명단에 없는 사람 추가">
      <button class="btn" id="addGuest">추가</button>
    </div>
    <div class="note">이름을 누르면 빼거나 넣을 수 있어요. 빼 둔 사람은 다음에도 기억합니다.</div>
  </div>

  <!-- 방식 -->
  <div class="panel">
    <div class="seg" id="seg">
      <button data-mode="1" class="on">1명 걸림</button>
      <button data-mode="2">2명 걸림</button>
      <button data-mode="3">3명 걸림</button>
      <button data-mode="team">4명씩 조</button>
    </div>
    <button class="btn accent big" id="go">뽑기 시작</button>
  </div>

  <!-- 결과 -->
  <div class="panel">
    <div class="panel-head">
      <h3>결과</h3>
      <span class="grow"></span>
      <button class="btn sm" id="copy" disabled>결과 복사</button>
    </div>
    <div class="banner" id="banner"></div>
    <div id="out"><div class="empty">참가자를 확인하고 ‘뽑기 시작’을 누르세요.</div></div>
  </div>
</div>

<script type="module">
import { initializeApp, getApps, getApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBsOQMj6GTx1GVJVqjurZGlk0c1v1MjNOk",
  authDomain: "board-sheet-metal.firebaseapp.com",
  databaseURL: "https://board-sheet-metal-default-rtdb.firebaseio.com",
  projectId: "board-sheet-metal",
  storageBucket: "board-sheet-metal.firebasestorage.app",
  messagingSenderId: "300454183349",
  appId: "1:300454183349:web:7a5e681d9c6c1f7b5999fc"
};
const app = getApps().length ? getApp() : initializeApp(firebaseConfig);
const db = getDatabase(app);
const username = localStorage.getItem("username");

const $ = id => document.getElementById(id);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));
const TEAM_COLORS = ["--note-blue-line","--note-orange-line","--note-green-line","--note-pink-line",
                     "--note-purple-line","--note-teal-line","--note-yellow-line","--note-cyan-line"];

/* ── 상태 ── */
const KEY_OFF = "drawExcluded", KEY_GUEST = "drawGuests", KEY_MODE = "drawMode";
let members = [];                                   // 회원 (admin 제외)
let guests = load(KEY_GUEST, []);                   // 직접 추가한 사람
let excluded = new Set(load(KEY_OFF, []));          // 빼 둔 사람
let mode = localStorage.getItem(KEY_MODE) || "1";
let running = false;
let lastText = "";

function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) || d; } catch (e) { return d; } }
function store(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

const everyone = () => [...members, ...guests];
const chosen = () => everyone().filter(n => !excluded.has(n));

/* ── 참가자 ── */
function renderPeople() {
  const all = everyone();
  $("people").innerHTML = all.length
    ? all.map(n => `<button class="person${excluded.has(n) ? "" : " on"}${guests.includes(n) ? " guest" : ""}"
                      data-n="${esc(n)}">${esc(n)}</button>`).join("")
    : `<div class="empty">불러온 회원이 없습니다. 아래에서 직접 추가하세요.</div>`;
  $("people").querySelectorAll(".person").forEach(b => {
    b.onclick = () => {
      if (running) return;
      const n = b.dataset.n;
      if (guests.includes(n)) {                     // 직접 추가한 사람은 누르면 명단에서 지웁니다
        guests = guests.filter(g => g !== n); store(KEY_GUEST, guests);
        excluded.delete(n);
      } else if (excluded.has(n)) excluded.delete(n);
      else excluded.add(n);
      store(KEY_OFF, [...excluded]);
      renderPeople();
    };
  });
  $("cnt").textContent = chosen().length + "명";
  updateGo();
}

function addGuest() {
  const n = $("guest").value.trim();
  if (!n) return;
  if (!everyone().includes(n)) { guests.push(n); store(KEY_GUEST, guests); }
  excluded.delete(n); store(KEY_OFF, [...excluded]);
  $("guest").value = "";
  renderPeople();
}

/* ── 방식 ── */
function setMode(m) {
  mode = m;
  try { localStorage.setItem(KEY_MODE, m); } catch (e) {}
  $("seg").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  updateGo();
}

function updateGo() {
  const n = chosen().length;
  const need = mode === "team" ? 2 : Number(mode) + 1;
  $("go").disabled = running || n < need;
  $("go").textContent = running ? "뽑는 중…" :
    n < need ? `참가자가 ${need}명 이상 필요해요` :
    mode === "team" ? `${n}명 → ${teamSizes(n).length}개 조 짜기` : `${n}명 중 ${mode}명 뽑기`;
}

/* ── 공정한 섞기 (crypto 난수) ── */
function rand(n) {
  const a = new Uint32Array(1);
  const lim = Math.floor(0x100000000 / n) * n;
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}

/* 4명씩: 조 수 = 올림(n/4), 남는 인원은 고르게 (10명 → 4·3·3) */
function teamSizes(n) {
  const g = Math.max(1, Math.ceil(n / 4));
  const base = Math.floor(n / g), extra = n % g;
  return Array.from({ length: g }, (_, i) => base + (i < extra ? 1 : 0));
}

/* ── 뽑기 ── */
async function draw() {
  if (running) return;
  const people = shuffle(chosen());
  $("banner").closest(".panel").scrollIntoView({ behavior: "smooth", block: "start" });     // 목록 순서도 매번 섞습니다
  if (mode === "team") return makeTeams(people);

  const k = Number(mode);
  running = true; updateGo();
  $("copy").disabled = true;
  $("banner").innerHTML = "두근두근…";
  $("out").innerHTML = `<div class="list">${people.map((n, i) =>
    `<div class="row"><span class="no">${i + 1}</span><span class="nm">${esc(n)}</span><span class="tag"></span></div>`
  ).join("")}</div>`;
  const rows = [...$("out").querySelectorAll(".row")];

  const picked = [];
  const pool = people.map((_, i) => i);
  for (let round = 0; round < k; round++) {
    const target = pool.splice(rand(pool.length), 1)[0];     // 결과를 먼저 정하고, 연출만 돌립니다
    await roulette(rows, pool.concat(target), target, round === 0 ? 2600 : 1700);
    rows[target].classList.add("hit");
    rows[target].querySelector(".tag").textContent = "걸림!";
    picked.push(people[target]);
    $("banner").innerHTML = `🎉 ${esc(people[target])}` + (k > 1 ? `<small>${round + 1} / ${k}</small>` : "");
    fireworks(round === k - 1 ? 2600 : 1400);
    if (round < k - 1) await sleep(900);
  }
  rows.forEach(r => { if (!r.classList.contains("hit")) r.classList.add("safe"); });
  $("banner").innerHTML = `🎉 ${picked.map(esc).join(", ")}<small>${people.length}명 중 ${k}명 걸림</small>`;

  lastText = `[뽑기 ${k}명 걸림]\n` + picked.join(", ") + `\n(참가 ${people.length}명: ${people.join(", ")})`;
  finish("DRAW_PICK", { picked: picked.join(","), total: people.length });
}

/* 강조가 목록을 돌다가 점점 느려지며 target 에 멈춥니다 */
async function roulette(rows, candidates, target, dur) {
  const t0 = performance.now();
  let last = -1, gap = 45;
  while (performance.now() - t0 < dur) {
    let i; do i = candidates[rand(candidates.length)]; while (candidates.length > 1 && i === last);
    if (last >= 0) rows[last].classList.remove("flash");
    rows[i].classList.add("flash");
    last = i;
    await sleep(gap);
    gap = Math.min(gap * 1.07, 260);
  }
  if (last >= 0) rows[last].classList.remove("flash");
  rows[target].classList.add("flash");
  await sleep(350);
  rows[target].classList.remove("flash");
}

async function makeTeams(people) {
  running = true; updateGo();
  $("copy").disabled = true;
  const sizes = teamSizes(people.length);
  $("banner").innerHTML = "조를 섞는 중…";
  for (let t = 0; t < 10; t++) {                     // 잠깐 이름이 섞이는 모습
    $("out").innerHTML = `<div class="list">${shuffle(people).map(n =>
      `<div class="row flash"><span class="nm">${esc(n)}</span></div>`).join("")}</div>`;
    await sleep(70 + t * 12);
  }
  const teams = [];
  let p = 0;
  sizes.forEach(s => { teams.push(people.slice(p, p + s)); p += s; });

  $("out").innerHTML = `<div class="teams">${teams.map((t, i) => `
    <div class="team" style="--c:var(${TEAM_COLORS[i % TEAM_COLORS.length]});animation-delay:${i * 120}ms">
      <h4><b>${i + 1}조</b>${t.length}명</h4>
      <ul>${t.map(n => `<li>${esc(n)}</li>`).join("")}</ul>
    </div>`).join("")}</div>`;
  $("banner").innerHTML = `${teams.length}개 조 완성<small>${people.length}명 · ${sizes.join("·")}명</small>`;
  fireworks(1800);

  lastText = "[조짜기]\n" + teams.map((t, i) => `${i + 1}조: ${t.join(", ")}`).join("\n");
  finish("DRAW_TEAM", { teams: teams.map((t, i) => `${i + 1}조:${t.join(",")}`).join(" / ") });
}

function finish(action, details) {
  running = false; updateGo();
  $("copy").disabled = false;
  // 로그 조회에서 누가 언제 뽑았는지 볼 수 있게 남깁니다
  if (username) update(ref(db, "logs/" + Date.now()), { user: username, action, details, timestamp: Date.now() })
    .catch(() => {});
}

function copyResult() {
  const ok = () => { $("copy").textContent = "✓ 복사됨"; setTimeout(() => $("copy").textContent = "결과 복사", 1400); };
  if (navigator.clipboard) navigator.clipboard.writeText(lastText).then(ok, ok);
  else {
    const ta = document.createElement("textarea");
    ta.value = lastText; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e) {}
    document.body.removeChild(ta); ok();
  }
}

/* ── 폭죽 (canvas, 외부 라이브러리 없음 → 폐쇄망에서도 동작) ── */
const fx = $("fx"), ctx = fx.getContext("2d");
let parts = [], fxEnd = 0, fxOn = false, nextBurst = 0;
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const HUES = [8, 32, 48, 140, 200, 280, 330];

function sizeFx() {
  const r = devicePixelRatio || 1;
  fx.width = innerWidth * r; fx.height = innerHeight * r;
  ctx.setTransform(r, 0, 0, r, 0, 0);
}
addEventListener("resize", sizeFx);
sizeFx();

function burst() {
  const x = innerWidth * (0.15 + Math.random() * 0.7);
  const y = innerHeight * (0.12 + Math.random() * 0.35);
  const hue = HUES[Math.floor(Math.random() * HUES.length)];
  const n = 46 + Math.floor(Math.random() * 20);
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 + Math.random() * 0.2;
    const s = 2.2 + Math.random() * 3.2;
    parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: 1,
                 decay: 0.012 + Math.random() * 0.01, hue: hue + Math.random() * 30 - 15, r: 2 + Math.random() * 1.5 });
  }
}

function fireworks(ms) {
  if (reduce) return;
  fxEnd = performance.now() + ms;
  nextBurst = 0;
  if (!fxOn) { fxOn = true; requestAnimationFrame(tick); }
}

function tick(now) {
  if (now < fxEnd && now >= nextBurst) { burst(); nextBurst = now + 220 + Math.random() * 260; }
  ctx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life > 0);
  for (const p of parts) {
    p.vx *= 0.985; p.vy = p.vy * 0.985 + 0.06;
    p.x += p.vx; p.y += p.vy; p.life -= p.decay;
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = `hsl(${p.hue} 90% 58%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  if (parts.length || now < fxEnd) requestAnimationFrame(tick);
  else { fxOn = false; ctx.clearRect(0, 0, innerWidth, innerHeight); }
}

/* ── 연결 ── */
$("allOn").onclick = () => { if (running) return; excluded.clear(); store(KEY_OFF, []); renderPeople(); };
$("allOff").onclick = () => { if (running) return; everyone().forEach(n => excluded.add(n)); store(KEY_OFF, [...excluded]); renderPeople(); };
$("addGuest").onclick = addGuest;
$("guest").onkeydown = e => { if (e.key === "Enter" && !e.isComposing) addGuest(); };
$("seg").querySelectorAll("button").forEach(b => { b.onclick = () => { if (!running) setMode(b.dataset.mode); }; });
$("go").onclick = draw;
$("copy").onclick = copyResult;

setInterval(() => { $("clock").textContent = new Date().toTimeString().slice(0, 8); }, 1000);
$("clock").textContent = new Date().toTimeString().slice(0, 8);

setMode(mode);
renderPeople();

// 회원 명단 (admin 제외, 가나다순)
get(ref(db, "users")).then(snap => {
  members = Object.keys(snap.val() || {}).filter(id => id !== "admin")
    .sort((a, b) => a.localeCompare(b, "ko"));
  guests = guests.filter(g => !members.includes(g));
  store(KEY_GUEST, guests);
  renderPeople();
}).catch(e => {
  console.error("회원 명단 오류:", e);
  $("people").innerHTML = `<div class="empty">회원 명단을 불러오지 못했습니다. 아래에서 직접 추가하세요.</div>`;
});
</script>
</body>
</html>
